<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PD2 Generation Studio</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { overflow: hidden; }
  .studio { display: grid; grid-template-columns: 240px 1fr 300px; grid-template-rows: auto 1fr;
            height: 100vh; gap: 0; }
  .sbar { grid-column: 1 / 4; display: flex; align-items: center; gap: 14px; padding: 8px 14px;
          border-bottom: 1px solid var(--line, #3a3226); background: #1a160f; }
  .sbar h1 { font-size: 16px; margin: 0; color: var(--gold, #d8b25a); }
  .sbar .sp { flex: 1; }
  .pill { font-size: 12px; padding: 3px 9px; border-radius: 10px; background: #241d12; border: 1px solid #3a3226; }
  .pill.ok { border-color: #5a7d4a; color: #a9d48a; } .pill.bad { border-color: #7d4a4a; color: #d48a8a; }
  .items { overflow-y: auto; border-right: 1px solid #3a3226; padding: 6px; }
  .items input { width: 100%; margin-bottom: 6px; }
  .irow { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 5px; cursor: pointer; font-size: 13px; }
  .irow:hover { background: #241d12; } .irow.sel { background: #2f2716; outline: 1px solid var(--gold, #d8b25a); }
  .irow img { width: 30px; height: 30px; object-fit: contain; background: #2a1414; border-radius: 3px; }
  .stage { position: relative; display: flex; flex-direction: column; }
  #viewer { flex: 1; min-height: 0; background: radial-gradient(circle at 50% 40%, #2a2a30, #14141a); }
  .stagebar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid #3a3226;
              background: #17130d; min-height: 30px; }
  .stagebar .prog { font-size: 12px; color: #b8a97e; flex: 1; }
  .panel { overflow-y: auto; border-left: 1px solid #3a3226; padding: 12px; }
  .grp { margin-bottom: 14px; }
  .grp > label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
                 color: #8a7d5e; margin-bottom: 6px; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
  button.big { flex: 1; padding: 9px; font-size: 13px; }
  button.primary { background: #3a5d2a; border-color: #5a7d4a; color: #dfeccf; }
  button.gold { background: #4a3d1a; border-color: var(--gold, #d8b25a); color: #f0dca8; }
  .sl { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 5px 0; }
  .sl input[type=range] { flex: 1; } .sl .v { width: 40px; text-align: right; color: var(--gold, #d8b25a); font-variant-numeric: tabular-nums; }
  details summary { cursor: pointer; font-size: 12px; color: #b8a97e; margin: 8px 0; }
  .cellprev { text-align: center; }
  .cellprev img { image-rendering: pixelated; max-height: 150px; background: #2a1414; border-radius: 4px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .mini { font-size: 11px; color: #8a7d5e; }
  select, input[type=number], input[type=text] { background: #241d12; border: 1px solid #3a3226; color: var(--ink,#e8dcc0); border-radius: 4px; padding: 4px 6px; }
</style>
</head>
<body>
<div class="studio">
  <div class="sbar">
    <h1>⚒ PD2 Generation Studio</h1>
    <span id="sess" class="pill">session: …</span>
    <span id="cred" class="pill">credits: …</span>
    <button id="loginBtn" class="hidden">Launch login browser</button>
    <span class="sp"></span>
    <a href="/"><button>← Gallery</button></a>
  </div>

  <div class="items">
    <input id="search" type="search" placeholder="Search items…">
    <div id="ilist"></div>
  </div>

  <div class="stage">
    <div id="viewer"></div>
    <div class="stagebar">
      <span id="prog" class="prog">Pick an item, then Generate.</span>
      <span id="phasePill" class="pill hidden"></span>
    </div>
  </div>

  <div class="panel">
    <div class="grp">
      <label>1 · Generate</label>
      <div class="btnrow">
        <button id="genBtn" class="big primary" disabled>Generate draft</button>
      </div>
      <details><summary>Generation settings</summary>
        <div class="sl">model
          <select id="aiModel"><option value="avocado" selected>Meshy 6</option><option value="meshy-5">Meshy 5</option></select></div>
        <div class="sl">topology
          <select id="topology"><option value="triangle" selected>triangle</option><option value="quad">quad</option></select></div>
        <div class="sl">symmetry
          <select id="symmetry"><option value="0" selected>auto</option><option value="1">on</option><option value="2">off</option></select></div>
        <div class="sl">seed <input type="number" id="seed" value="0" style="width:80px"></div>
      </details>
    </div>

    <div class="grp" id="draftActions" style="opacity:.4">
      <label>2 · Shape — re-roll until it's right</label>
      <div class="btnrow">
        <button id="rerollBtn" class="big" disabled>⟳ Re-roll shape</button>
      </div>
      <div id="rerollNote" class="mini"></div>
    </div>

    <div class="grp" id="texActions" style="opacity:.4">
      <label>3 · Texture</label>
      <div class="btnrow">
        <button id="texBtn" class="big gold" disabled>Generate texture</button>
      </div>
      <details><summary>Texture settings</summary>
        <div class="sl">style
          <select id="artStyle"><option value="realistic" selected>realistic</option><option value="cartoon">cartoon</option><option value="sculpture">sculpture</option></select></div>
        <div class="sl">PBR <input type="checkbox" id="enablePBR" checked></div>
        <input type="text" id="texPrompt" placeholder="optional texture prompt (e.g. dark bronze)" style="width:100%;margin-top:4px">
      </details>
    </div>

    <div class="grp" id="acceptGrp" style="opacity:.4">
      <label>4 · Frame · tone · accept</label>
      <div class="cellprev"><img id="cellPrev" alt="in-cell preview"></div>
      <div class="sl">angle <input type="range" id="azim" min="0" max="359" step="5" value="25"><span class="v" id="azimV">25</span></div>
      <div class="sl">tilt <input type="range" id="elev" min="-15" max="70" step="5" value="15"><span class="v" id="elevV">15</span></div>
      <div class="sl">fill <input type="range" id="fill" min="0.5" max="1.15" step="0.02" value="0.94"><span class="v" id="fillV">.94</span></div>
      <div class="sl">bright <input type="range" id="brightness" min="0.3" max="1.4" step="0.02" value="1"><span class="v" id="brightnessV">1</span></div>
      <div class="sl">warmth <input type="range" id="warmth" min="0.6" max="1.4" step="0.02" value="1"><span class="v" id="warmthV">1</span></div>
      <div class="sl">sat <input type="range" id="saturation" min="0.4" max="2" step="0.05" value="1"><span class="v" id="saturationV">1</span></div>
      <div class="sl">contr <input type="range" id="contrast" min="0.6" max="1.8" step="0.05" value="1"><span class="v" id="contrastV">1</span></div>
      <div class="btnrow" style="margin-top:8px">
        <button id="acceptBtn" class="big primary" disabled>Accept → DC6</button>
        <button id="pushBtn" class="big" disabled>Push to game</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module" src="/static/studio.js"></script>
</body>
</html>
