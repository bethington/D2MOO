<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pair Meshy generations — PD2 Asset Studio</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .pairbar { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); position:sticky; top:49px; background:var(--bg); z-index:4; }
  .pairbar .count { color:var(--muted); font-size:12px; }
  .rows { padding:12px 16px 80px; display:flex; flex-direction:column; gap:12px; }

  .prow { border:1px solid var(--line); border-radius:8px; background:var(--panel); overflow:hidden; }
  .prow.done { opacity:.55; border-color:var(--accent); }
  .prow > .head { display:flex; align-items:center; gap:10px; padding:6px 10px; background:var(--panel2); border-bottom:1px solid var(--line); }
  .prow .tname { font-weight:600; color:var(--gold); }
  .prow .tmeta { font-size:11px; color:var(--muted); }
  .prow .rowact { margin-left:auto; display:flex; gap:6px; }

  .body { display:flex; gap:14px; padding:10px; align-items:flex-start; }
  .anchor { display:flex; gap:8px; flex:0 0 auto; padding-right:14px; border-right:1px dashed var(--line); }
  .anchor figure { margin:0; text-align:center; }
  .anchor img { width:150px; height:150px; object-fit:contain; border:1px solid var(--gold); border-radius:5px; image-rendering:pixelated; }
  .anchor figcaption { font-size:10px; color:var(--muted); margin-top:3px; }

  .cands { display:flex; gap:8px; flex-wrap:wrap; align-content:flex-start; }
  .cand { position:relative; }
  .cand input { position:absolute; top:6px; left:6px; margin:0; z-index:2; accent-color:var(--gold); cursor:pointer; }
  .cand label { display:block; width:104px; border:1px solid var(--line); border-radius:5px; padding:4px; cursor:pointer; background:var(--panel2); }
  .cand label:hover { border-color:var(--gold); }
  .cand input:checked + label { border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); background:#33291a; }
  .cand.chosen label { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .cand .mini { position:absolute; right:2px; bottom:26px; width:34px; height:34px; object-fit:contain;
                background:#111a; border:1px solid var(--line); border-radius:3px; }
  .cand label.static { cursor:default; }
  .prow.unplaced { border-color:#6a4030; }
  .prow.ignored { border-color:#3a3020; opacity:.75; }
  .cand .xbtn { position:absolute; top:2px; right:2px; z-index:3; padding:0 5px; font-size:11px;
                line-height:16px; background:#2a2318cc; border:1px solid var(--line);
                border-radius:3px; color:var(--muted); cursor:pointer; }
  .cand .xbtn:hover { color:#e0a07a; border-color:#6a4030; }
  .cand .nonebtn { width:104px; margin-top:4px; padding:3px; font-size:11px;
                   background:var(--panel2); color:var(--muted);
                   border:1px solid var(--line); border-radius:4px; cursor:pointer; }
  .cand .nonebtn:hover { border-color:var(--gold); color:var(--ink); }
  .cand.none label { line-height:1.35; }
  .cand .assign { width:104px; margin-top:4px; background:var(--panel2); color:var(--ink);
                  border:1px solid var(--line); padding:4px 6px; border-radius:4px; font-size:11px; }
  .hit { display:flex; align-items:center; gap:5px; padding:3px; cursor:pointer; border-radius:3px; }
  .hit:hover { background:#33291a; }
  .hit img { width:26px; height:26px; object-fit:contain; image-rendering:pixelated; }
  .hit span { font-size:10px; color:var(--muted); }
  .hits { max-width:150px; }
  .cand .ph { height:88px; display:flex; align-items:center; justify-content:center; border-radius:3px; }
  .cand .ph img { max-width:84px; max-height:84px; image-rendering:pixelated; }
  .cand .nm { font-size:11px; text-align:center; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cand .why { font-size:10px; color:var(--muted); text-align:center; }
  .cand .also { font-size:9px; color:#8a7a5a; text-align:center; margin-top:2px;
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cand.best .why { color:var(--accent); }
  .cand.none label { display:flex; align-items:center; justify-content:center; height:100%; min-height:120px; color:var(--muted); font-size:12px; }

  .prow.needsconfirm { border-color:#c96a4a; }
  .warn { font-size:11px; color:#e0a07a; background:#3a2418; border:1px solid #6a4030;
          padding:2px 7px; border-radius:10px; }
  .searchcell { width:190px; }
  .searchcell input { width:100%; background:var(--panel2); color:var(--ink);
                      border:1px solid var(--line); padding:6px 8px; border-radius:5px; font-size:12px; }
  .searchcell input:focus { border-color:var(--gold); outline:none; }
  .hits { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .hits .cand label { width:88px; }
  .hits .cand .ph { height:64px; }
  .hits .cand .ph img { max-width:60px; max-height:60px; }

  .pairbox { border:1px solid var(--gold); border-radius:6px; padding:8px; background:#2a231880;
             display:flex; flex-direction:column; gap:6px; }
  .slots { display:flex; gap:8px; }
  .slot { width:104px; }
  .slot .slotlbl { font-size:10px; color:var(--gold); text-align:center; margin-bottom:2px; }
  .slot .ph { height:72px; display:flex; align-items:center; justify-content:center;
              border:1px solid var(--line); border-radius:4px; }
  .slot .ph img { max-width:66px; max-height:66px; }
  .slot select { width:104px; margin-top:3px; font-size:10px; background:var(--panel2);
                 color:var(--ink); border:1px solid var(--line); border-radius:3px; padding:2px; }
  .slot.empty .ph { border-style:dashed; }
  .varrow { display:flex; align-items:center; gap:6px; }
  .varrow select { flex:1; font-size:11px; background:var(--panel2); color:var(--ink);
                   border:1px solid var(--line); border-radius:3px; padding:3px; }
  .slot .ph img.mir { transform:scaleX(-1); opacity:.75; }
  .mirrorwarn { font-size:10px; color:#e0a07a; max-width:220px; line-height:1.3; }
  .pairacts { display:flex; gap:6px; }

  .tuner { position:fixed; inset:0; background:#000b; z-index:60; display:flex;
           align-items:center; justify-content:center; }
  .tunerbox { background:var(--panel); border:1px solid var(--gold); border-radius:8px;
              padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .tunerbox h3 { margin:0; color:var(--gold); font-size:15px; }
  .tunerstage { position:relative; align-self:center; line-height:0; }
  /* The original sprite is no longer drawn behind the hands -- on dark gloves
     (invmgl especially) it showed through and muddled them. The element is KEPT with
     opacity 0 because the stage geometry is measured from its box; hiding it with
     display:none would collapse that to zero. */
  .tunerstage { background:#000; }
  .tunerstage .ghost { opacity:0; image-rendering:pixelated; display:block; }
  .tunerstage .hand { position:absolute; cursor:grab; user-select:none;
                      transform-origin:center center; }
  .tunerstage .hand.sel { outline:1px dashed var(--gold); outline-offset:2px; }
  .tunerwrap { align-self:center; padding:52px; position:relative; overflow:hidden;
               border-radius:6px; background:#15110c; }
  .tunerstage .bounds { position:absolute; inset:0; pointer-events:none; z-index:5;
                        border:2px solid var(--gold); box-shadow:0 0 0 320px rgba(8,6,4,.74); }
  .tunerstage .cellgrid { position:absolute; inset:0;
    background-image:linear-gradient(to right, rgba(201,164,74,.28) 1px, transparent 1px),
                     linear-gradient(to bottom, rgba(201,164,74,.28) 1px, transparent 1px); }
  .boundsinfo { display:flex; gap:14px; align-items:center; font-size:11px; color:var(--muted); }
  .clipstat.ok { color:var(--accent); }
  .clipstat.warn { color:var(--gold); }
  .clipstat.bad { color:#e0705a; font-weight:600; }
  .tunerhelp { font-size:11px; color:var(--muted); }
  .ctlrow { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted);
            padding:3px 6px; border:1px solid transparent; border-radius:4px; }
  .ctlrow.sel { border-color:var(--line); background:#2a231855; }
  .ctlrow .ctlname { width:44px; color:var(--gold); font-weight:600; }
  .ctlrow label { display:flex; align-items:center; gap:5px; }
  .ctlrow input[type=range] { width:130px; accent-color:var(--gold); }
  .ctlrow output { width:46px; text-align:right; color:var(--ink); }
  .ctlrow output.offout { width:120px; text-align:left; }
  .ctlrow button { padding:2px 7px; font-size:10px; }
  .tuneracts { display:flex; align-items:center; gap:8px; }
  .tuneracts .count { margin-left:auto; margin-right:8px; }

  .stickyfoot { position:fixed; bottom:0; left:0; right:0; display:flex; align-items:center; gap:12px;
                padding:10px 16px; background:linear-gradient(#1a150e,#241d13); border-top:1px solid var(--line); z-index:6; }
  .empty { padding:40px 16px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Pair Meshy generations</h1>
  <div class="game" id="scanState">scanning…</div>
  <div class="actions">
    <a href="/"><button>← Gallery</button></a>
    <button id="rescanBtn" title="Re-scan your Meshy workspace">↻ Rescan</button>
  </div>
</header>

<div class="pairbar">
  <span class="count" id="counts"></span>
</div>

<div class="rows" id="rows"><div class="empty">Scanning your Meshy workspace…</div></div>

<div class="stickyfoot">
  <span class="count">Left = the original PD2 artwork from the DC6. Right = your Meshy generations matched to it
  (matched exactly via your re-imagined art library, by filename). Pick which generation each art file should use.</span>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/static/pairing.js"></script>
</body>
</html>
