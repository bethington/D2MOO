<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pair Meshy generations — PD2 Asset Studio</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .pairbar { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); position:sticky; top:49px; background:var(--bg); z-index:4; }
  .pairbar .count { color:var(--muted); font-size:12px; }
  .rows { padding:12px 16px 80px; display:flex; flex-direction:column; gap:12px; }

  .prow { border:1px solid var(--line); border-radius:8px; background:var(--panel); overflow:hidden; }
  .prow.done { opacity:.55; border-color:var(--accent); }
  .prow > .head { display:flex; align-items:center; gap:10px; padding:6px 10px; background:var(--panel2); border-bottom:1px solid var(--line); }
  .prow .tname { font-weight:600; color:var(--gold); }
  .prow .tmeta { font-size:11px; color:var(--muted); }
  .prow .rowact { margin-left:auto; display:flex; gap:6px; }

  .body { display:flex; gap:14px; padding:10px; align-items:flex-start; }
  .anchor { display:flex; gap:8px; flex:0 0 auto; padding-right:14px; border-right:1px dashed var(--line); }
  .anchor figure { margin:0; text-align:center; }
  .anchor img { width:104px; height:104px; object-fit:contain; border:1px solid var(--line); border-radius:5px; }
  .anchor figcaption { font-size:10px; color:var(--muted); margin-top:3px; }

  .cands { display:flex; gap:8px; flex-wrap:wrap; align-content:flex-start; }
  .cand { position:relative; }
  .cand input { position:absolute; top:6px; left:6px; margin:0; z-index:2; accent-color:var(--gold); cursor:pointer; }
  .cand label { display:block; width:104px; border:1px solid var(--line); border-radius:5px; padding:4px; cursor:pointer; background:var(--panel2); }
  .cand label:hover { border-color:var(--gold); }
  .cand input:checked + label { border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); background:#33291a; }
  .cand .ph { height:88px; display:flex; align-items:center; justify-content:center; border-radius:3px; }
  .cand .ph img { max-width:84px; max-height:84px; image-rendering:pixelated; }
  .cand .nm { font-size:11px; text-align:center; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cand .why { font-size:10px; color:var(--muted); text-align:center; }
  .cand .also { font-size:9px; color:#8a7a5a; text-align:center; margin-top:2px;
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cand.best .why { color:var(--accent); }
  .cand.none label { display:flex; align-items:center; justify-content:center; height:100%; min-height:120px; color:var(--muted); font-size:12px; }

  .prow.needsconfirm { border-color:#c96a4a; }
  .warn { font-size:11px; color:#e0a07a; background:#3a2418; border:1px solid #6a4030;
          padding:2px 7px; border-radius:10px; }
  .searchcell { width:190px; }
  .searchcell input { width:100%; background:var(--panel2); color:var(--ink);
                      border:1px solid var(--line); padding:6px 8px; border-radius:5px; font-size:12px; }
  .searchcell input:focus { border-color:var(--gold); outline:none; }
  .hits { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .hits .cand label { width:88px; }
  .hits .cand .ph { height:64px; }
  .hits .cand .ph img { max-width:60px; max-height:60px; }

  .stickyfoot { position:fixed; bottom:0; left:0; right:0; display:flex; align-items:center; gap:12px;
                padding:10px 16px; background:linear-gradient(#1a150e,#241d13); border-top:1px solid var(--line); z-index:6; }
  .empty { padding:40px 16px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Pair Meshy generations</h1>
  <div class="game" id="scanState">scanning…</div>
  <div class="actions">
    <a href="/"><button>← Gallery</button></a>
    <button id="rescanBtn" title="Re-scan your Meshy workspace">↻ Rescan</button>
  </div>
</header>

<div class="pairbar">
  <span class="count" id="counts"></span>
  <label class="count"><input type="checkbox" id="hideDone"> hide linked</label>
</div>

<div class="rows" id="rows"><div class="empty">Scanning your Meshy workspace…</div></div>

<div class="stickyfoot">
  <button id="linkAllBtn" class="gold" disabled>Link all picked</button>
  <span class="count" id="pickCount">nothing picked yet</span>
  <span class="count">Options are PD2 <b>DC6 art files</b> (many items share one file) — pick the file that matches what you fed Meshy. Strongest → weakest, left to right.</span>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/static/pairing.js"></script>
</body>
</html>
